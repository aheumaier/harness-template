# Harness file (protected). Red only when api/openapi.yaml breaks existing clients (oasdiff, ERR level).
# Runs on every PR (not path-filtered) so it can be a required check; it skips oasdiff when the spec is
# unchanged. The `breaking-change-approved` label (a human decision after reading the PR's migration plan;
# CODEOWNERS review of api/openapi.yaml still applies) turns a breaking change green. rules.md#api-no-breaking-change
#
# pull_request_target, like harness-integrity.yml: workflow, Makefile, script and oasdiff version come from
# the base branch; the PR's spec is only parsed. Same safety constraints (docs/adr/0010-base-branch-gates.md):
# no PR code executed, only head.sha in `run:` via env, `contents: read`, no secrets.
name: contract-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  api-no-breaking-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (base branch)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR head (read, never executed)
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$PR_SHA"
          git worktree add --detach "$RUNNER_TEMP/pr" "$PR_SHA"
      - name: Did api/openapi.yaml change?
        id: spec
        working-directory: ${{ runner.temp }}/pr
        run: |
          base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          if git diff --quiet "$base" -- api/openapi.yaml; then echo changed=false; else echo changed=true; fi >>"$GITHUB_OUTPUT"
      - if: steps.spec.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - name: Install oasdiff (version from the base branch's scripts/tool-versions.env)
        if: steps.spec.outputs.changed == 'true'
        run: |
          source scripts/tool-versions.env
          GOBIN="$PWD/.bin" go install "github.com/oasdiff/oasdiff@$OASDIFF_VERSION"
      - if: steps.spec.outputs.changed == 'true'
        run: make contract-check BASE_REF="origin/$GITHUB_BASE_REF"
        env:
          HARNESS_ROOT: ${{ runner.temp }}/pr
          BREAKING_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') && '1' || '0' }}
