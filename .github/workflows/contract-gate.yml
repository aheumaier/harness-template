# Harness file (protected). Red only when the OpenAPI contract (SPEC in scripts/harness/layout.env) breaks
# existing clients (oasdiff, ERR level). Runs on every PR (not path-filtered) so it can be a required check; it
# skips oasdiff when the spec is unchanged. The `breaking-change-approved` label (a human decision after reading
# the PR's migration plan; CODEOWNERS review of the spec still applies) turns a breaking change green.
# rules.md#api-no-breaking-change
#
# pull_request_target, like harness-integrity.yml: workflow, Makefile, script and oasdiff version come from
# the base branch; the PR's spec is only parsed. Same safety constraints (docs/adr/0010-base-branch-gates.md):
# no PR code executed, only head.sha used (as the checkout ref), `contents: read`, no secrets.
# The PR's spec must not have external $refs (contract-check.sh), so oasdiff reads nothing else.
name: contract-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  api-no-breaking-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (base branch)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the PR head (read, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false
      - name: Load the base branch's scripts/harness/layout.env (SPEC, API_DIR)
        run: scripts/harness/layout.sh --print >>"$GITHUB_ENV"
      - name: Did the contract (SPEC) change?
        id: spec
        working-directory: pr-head
        run: |
          base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          if git diff --quiet "$base" -- "$SPEC"; then echo changed=false; else echo changed=true; fi >>"$GITHUB_OUTPUT"
      - if: steps.spec.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.API_DIR }}/go.mod
          cache: false
      - name: Install oasdiff (version from the base branch's scripts/tool-versions.env)
        if: steps.spec.outputs.changed == 'true'
        run: |
          source scripts/tool-versions.env
          GOBIN="$PWD/.bin" go install "github.com/oasdiff/oasdiff@$OASDIFF_VERSION"
      - if: steps.spec.outputs.changed == 'true'
        run: make contract-check BASE_REF="origin/$GITHUB_BASE_REF"
        env:
          HARNESS_ROOT: ${{ github.workspace }}/pr-head
          BREAKING_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') && '1' || '0' }}
