# Harness file (protected). The change must not weaken the harness: every added suppression carries
# `reason: … (rule: <id>)`, @ts-ignore never appears, harness configs are not loosened.
# rules.md#harness-suppression-reason, #harness-config-not-loosened
#
# The `harness-change-approved` label waives the config check only (never the suppression check). It is a
# human decision after reading the rationale in the PR description; CODEOWNERS review still applies.
# The check itself (Makefile, run.sh, integrity-check.sh, protected-paths.txt) comes from the base branch,
# so a PR cannot weaken the sensor that judges it; only the change under test comes from the PR.
name: harness-integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  harness-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the base branch's harness
        run: git worktree add --detach "$RUNNER_TEMP/base" "origin/$GITHUB_BASE_REF"
      - run: make -C "$RUNNER_TEMP/base" harness-integrity BASE_REF="origin/$GITHUB_BASE_REF"
        env:
          HARNESS_ROOT: ${{ github.workspace }}
          HARNESS_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'harness-change-approved') && '1' || '0' }}
