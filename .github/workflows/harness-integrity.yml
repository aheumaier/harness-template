# Harness file (protected). The change must not weaken the harness: every added suppression carries
# `reason: … (rule: <id>)`, @ts-ignore never appears, harness configs are not loosened.
# rules.md#harness-suppression-reason, #harness-config-not-loosened
#
# The `harness-change-approved` label waives the config check only (never the suppression check). It is a
# human decision after reading the rationale in the PR description; CODEOWNERS review still applies.
name: harness-integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  harness-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make harness-integrity BASE_REF="origin/$GITHUB_BASE_REF"
        env:
          HARNESS_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'harness-change-approved') && '1' || '0' }}
