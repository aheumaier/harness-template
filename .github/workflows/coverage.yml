# Harness file (protected). Unit-test coverage per Go package and JS workspace into the job summary: a trend,
# never a gate (docs/adr/0020-test-coverage-is-a-trend.md, docs/harness/ci.md#coverage). A report, not a
# sensor: its own workflow, so its job is not a required status check (every ci.yml job is one,
# scripts/github-branch-protection.sh), and continue-on-error, so a failure to measure shows without blocking.
name: coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make setup
      - run: make coverage >>"$GITHUB_STEP_SUMMARY"
