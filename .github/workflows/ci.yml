# Harness file (protected). The fresh-clone definition of done, on every PR and on main.
# Job names are required status checks: keep them in sync with scripts/github-branch-protection.sh.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Sensors that diff against a base (contract, migrations, harness integrity) compare with the PR target.
  BASE_REF: origin/${{ github.base_ref || 'main' }}
  # CI runs every sensor; only a local `make check` skips the ones whose inputs did not change (rules.md#harness-scope).
  HARNESS_SCOPE: full

jobs:
  check-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make setup
      # The Trivy vulnerability DB for deps-no-known-vulns (make vuln-deps), refreshed once a day.
      - id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ steps.today.outputs.date }}
          restore-keys: trivy-db-
      # contract-check, harness-integrity, commits and specs run in their own base-branch workflows, which
      # see the PR title and honour the human label waivers.
      - run: make check-all BASE_REF="$BASE_REF" CHECK_ALL_SKIP="contract-check harness-integrity commits specs"
      # Sensor and hook timings (scripts/harness/timing.sh) for the nightly latency report (exec plan 0002);
      # kept 8 days so that its 7-day window is always complete. Budget warnings are already annotations.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harness-timings-check-all
          path: .cache/harness/timings.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 8

  harness-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make setup
      - run: make harness-selftest

  generator-probe:
    # The domain generator must keep producing code that passes every fast sensor.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make setup
      - run: make new-domain NAME=zzz_probe
      - run: make check
      - name: The probe stays inside the generator's paths
        run: |
          git checkout -- .
          git clean -fdq -- apps/api api docs packages/api-client
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
