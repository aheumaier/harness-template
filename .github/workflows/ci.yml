# Harness file (protected). The fresh-clone definition of done, on every PR and on main.
# Job names are required status checks: keep them in sync with scripts/github-branch-protection.sh.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Sensors that diff against a base (contract, migrations, harness integrity) compare with the PR target.
  BASE_REF: origin/${{ github.base_ref || 'main' }}
  # Every sensor in a job that runs runs; only a local `make check` skips the ones whose inputs did not change
  # (rules.md#harness-scope). generator-probe skips as a whole on a PR that changes none of its inputs (ADR 0044).
  HARNESS_SCOPE: full

jobs:
  check-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The only job that runs make e2e, so the only one with its browser (ADR 0025): make e2e installs it into
      # .bin/playwright on demand, cached here; make e2e-deps adds its system libraries (unpinned apt via sudo, TD-42).
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: make setup
      - run: make e2e-deps
      # The Trivy vulnerability DB for deps-no-known-vulns (make vuln-deps), refreshed once a day.
      - id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ steps.today.outputs.date }}
          restore-keys: trivy-db-
      # contract-check, harness-integrity, commits and specs run in their own base-branch workflows, which
      # see the PR title and honour the human label waivers.
      - run: make check-all BASE_REF="$BASE_REF" CHECK_ALL_SKIP="contract-check harness-integrity commits specs"
      # Sensor and hook timings (scripts/harness/timing.sh) for the nightly latency report (exec plan 0002);
      # kept 8 days so that its 7-day window is always complete. Budget warnings are already annotations.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harness-timings-check-all
          path: .cache/harness/timings.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 8
      # A failed make e2e: its screenshot, page snapshot and trace (.tmp/e2e) and make dev's output (.tmp/dev),
      # which the web-e2e-journeys remediation names.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure
          path: |
            .tmp/e2e
            .tmp/dev
          if-no-files-found: ignore
          retention-days: 3

  harness-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make setup
      # Ubuntu is not macOS: no ios sensor runs here, so the NEEDS_SWIFT and NEEDS_XCODE fixtures are skipped (ADR 0042,
      # 0043); the ios workflow runs them. SELFTEST_SKIP_XCODE is redundant: off macOS a NEEDS_XCODE fixture is
      # skipped by its Swift check first. It is set so the skip does not depend on that order.
      - run: make harness-selftest
        env:
          SELFTEST_SKIP_SWIFT: "1"
          SELFTEST_SKIP_XCODE: "1"

  generator-probe:
    # The domain generator must keep producing code that passes every fast sensor, with a passing service,
    # handler and integration test (NFR-B1). Always starts, so it can be required. Passes with a notice on a PR
    # that changes neither a harness file nor what the generated code builds on; a push to main always runs (ADR
    # 0044, amended 2026-11-07).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # What the generated code builds on: the generator and its template, the API's entry point, platform, Go
      # module, sqlc and Atlas config, migrations, queries, contract and client, the JS workspace, the Postgres the
      # integration tests run on, and the files the generator writes into. A domain's own code is no input.
      # unchanged.sh adds every protected path and fails closed.
      - name: Does this PR change the generator, what it builds on, or a harness file?
        id: gate
        shell: bash
        run: |
          layout="$(scripts/harness/layout.sh --print)"
          inputs=(scripts/new-domain.sh scripts/templates/new-domain package.json pnpm-lock.yaml pnpm-workspace.yaml
            turbo.json tsconfig.base.json 'compose*.y*ml' 'docker-compose*.y*ml' scripts/setup-worktree.sh docs/QUALITY.md
            docs/generated)
          api="$(sed -n 's/^API_DIR=//p' <<<"$layout")"
          [[ -z "$api" ]] || inputs+=("$api/cmd" "$api/internal/platform" "$api/go.mod" "$api/go.sum" "$api/sqlc.yaml" "$api/atlas.hcl")
          for v in MIGRATIONS_DIR QUERIES_DIR SPEC API_CLIENT_DIR; do
            p="$(sed -n "s/^$v=//p" <<<"$layout")"
            [[ -z "$p" ]] || inputs+=("$p")
          done
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && HARNESS_SCOPE=changed scripts/harness/unchanged.sh "${inputs[@]}"; then
            echo "::notice::this PR changes no harness file, generator or file the generated domain builds on: the generator's output passes as on its base, nothing to prove"
            echo skip=true >>"$GITHUB_OUTPUT"
          else
            echo skip=false >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/setup
      - if: steps.gate.outputs.skip != 'true'
        run: make setup
      - if: steps.gate.outputs.skip != 'true'
        run: make new-domain NAME=zzz_probe
      - if: steps.gate.outputs.skip != 'true'
        run: make check
      # The generated docs/QUALITY.md row is well-formed and matches its domain (ADR 0028). Deterministic: the
      # 30-day age check reads the clock, so only drift.yml runs it.
      - if: steps.gate.outputs.skip != 'true'
        run: make docs-quality-shape
      # Every Test* of scripts/templates/new-domain ran and passed against make setup's Postgres, none skipped
      # (go test -json; scripts/harness/scaffold-tests.sh).
      - name: The probe's service, handler and integration tests ran and passed (NFR-B1)
        if: steps.gate.outputs.skip != 'true'
        run: make test-scaffold NAME=zzz_probe
      # Restores only what the generator writes (its undo hint in scripts/new-domain.sh), so a change anywhere
      # else fails the assertion instead of being reset. The paths come from scripts/harness/layout.env, which
      # the setup action loaded into the env.
      - name: The probe stays inside the generator's paths
        if: steps.gate.outputs.skip != 'true'
        run: |
          git checkout -- "$API_DIR/cmd/api/routes.go" "$SPEC" "$API_DIR/sqlc.yaml" docs/QUALITY.md \
            "$MIGRATIONS_DIR/atlas.sum" docs/generated "$API_CLIENT_DIR/src/gen"
          git clean -fdq -- "$API_DIR/${LAYER_GLOB%/\*/\*}/zzz_probe" "$QUERIES_DIR/zzz_probe.sql" \
            "$MIGRATIONS_DIR/*_zzz_probe.sql" "$API_CLIENT_DIR/src/gen"
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  adoption-probe:
    # README.md "(b) Brownfield project", followed step by step on a minimal root-go.mod repo
    # (scripts/templates/adoption-probe), must end with make setup, check and harness-selftest green.
    # Template-only (ADR 0038): in a product (HARNESS_UPSTREAM set, README (a) step 3's make rename WRITE=1), or
    # in an adopted repo that removed the probe's script and declined it in .harness-version (README (b) step 6),
    # this job passes without running it, so neither it nor the required check is hand-edited.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Skips when this repo is a product: scripts/tool-versions.env sets HARNESS_UPSTREAM (ADR 0026, read from the
      # file as adoption-probe.sh reads it; the file is protected config, so setting it in the template needs the
      # label). Or when the script is removed and declined, the decline line as scripts/harness/sync-check.sh
      # reads it (`# declined <path>: <why>`). The decline alone is a `#` line harness-integrity does not read, so
      # it cannot skip the probe; removing the script is a harness config change that needs the label. Removed
      # but undeclined, in the template, turns this job red.
      - name: Is this repo a product, or the adoption probe removed and declined in .harness-version?
        id: probe
        shell: bash
        run: |
          if [[ -n "$(sed -n 's/^HARNESS_UPSTREAM=//p' scripts/tool-versions.env | tail -n 1)" ]]; then
            echo "::notice::HARNESS_UPSTREAM is set in scripts/tool-versions.env: this repo is a product and the adoption probe is template-only (ADR 0038), nothing to run"
            echo skip=true >>"$GITHUB_OUTPUT"
          elif [[ ! -e scripts/harness/adoption-probe.sh ]] &&
            grep -Eq '^#[[:space:]]*declined[[:space:]]+scripts/harness/adoption-probe\.sh: .' .harness-version; then
            echo "::notice::scripts/harness/adoption-probe.sh is removed and declined in .harness-version: the adoption probe is template-only (README (b) step 6), nothing to run"
            echo skip=true >>"$GITHUB_OUTPUT"
          else
            echo skip=false >>"$GITHUB_OUTPUT"
          fi
      # Its make tools installs the pinned tools, which the probe links into its repo.
      - if: steps.probe.outputs.skip != 'true'
        uses: ./.github/actions/setup
      - if: steps.probe.outputs.skip != 'true'
        run: make adoption-probe
      # The probe's timing against its budget (scripts/harness/budgets.txt), as check-all uploads its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.probe.outputs.skip != 'true'
        with:
          name: harness-timings-adoption-probe
          path: .cache/harness/timings.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 8
