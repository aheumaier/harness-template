# Harness file (protected). Pinned toolchain for every workflow: versions come from scripts/tool-versions.env
# (Go from apps/api/go.mod), tools land in .bin exactly as `make tools` puts them locally.
name: setup
description: Go, Node, pinned tools in .bin and JS dependencies, with caches.
inputs:
  deps:
    description: Install JS dependencies (pnpm install --frozen-lockfile).
    default: "true"
runs:
  using: composite
  steps:
    - name: Load scripts/tool-versions.env
      shell: bash
      run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >>"$GITHUB_ENV"

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: apps/api/go.mod
        cache-dependency-path: |
          apps/api/go.sum
          apps/api/tools/analyzers/go.sum

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache pinned tools (.bin)
      id: bin
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .bin
        key: bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tool-versions.env', 'scripts/install-tools.sh', 'apps/api/.custom-gcl.yml', 'apps/api/tools/analyzers/**') }}

    - name: Install pinned tools
      shell: bash
      env:
        BIN_CACHE_HIT: ${{ steps.bin.outputs.cache-hit }}
      run: |
        # The key covers every input of the custom golangci-lint build; a fresh checkout's mtimes would
        # otherwise make `make` rebuild it.
        if [[ "$BIN_CACHE_HIT" == true ]]; then touch .bin/golangci-lint-custom; fi
        make tools
        echo "PNPM_STORE=$(.bin/pnpm store path)" >>"$GITHUB_ENV"

    - name: Cache pnpm store
      if: inputs.deps == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install JS dependencies
      if: inputs.deps == 'true'
      shell: bash
      run: make deps
