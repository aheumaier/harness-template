# Per-worktree Postgres, and an opt-in observability stack (profile obs, `make obs-up`, ADR 0017). Project
# name, ports and POSTGRES_IMAGE come from .env.local (scripts/setup-worktree.sh), OBS_IMAGE from
# scripts/tool-versions.env (make and setup-worktree.sh export it), so every worktree gets its own containers,
# volume and ports. Local development and CI only, never production.
services:
  db:
    image: ${POSTGRES_IMAGE:?run make setup}
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DB_PORT:?run make setup}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - db:/var/lib/postgresql/data
  # OTel collector + Loki + Prometheus + Tempo + Grafana. Telemetry is disposable: no named volume. Every port
  # binds to 127.0.0.1 only: OTLP is unauthenticated and Grafana keeps admin/admin.
  obs:
    profiles: [obs]
    image: ${OBS_IMAGE:?run through make obs-up (OBS_IMAGE comes from scripts/tool-versions.env)}
    ports:
      - "127.0.0.1:${OTLP_PORT:?run make setup}:4318"
      - "127.0.0.1:${LOKI_PORT:?run make setup}:3100"
      - "127.0.0.1:${PROMETHEUS_PORT:?run make setup}:9090"
      - "127.0.0.1:${TEMPO_PORT:?run make setup}:3200"
      - "127.0.0.1:${GRAFANA_PORT:?run make setup}:3000"
    # Loki refuses every log push (HTTP 503, "Ingester is shutting down") while the disk Docker keeps containers
    # on (on macOS, Docker Desktop's virtual disk) is at least 90 % full, checked every 10 s from its start:
    # make logs then finds nothing, while traces and metrics still arrive. A developer's Docker disk or the CI
    # runner (99 % full, 2026-10-31) can be past that. The telemetry is disposable (no volume) and a dev or CI
    # run writes little, so 0 turns the throttle off. otel-lgtm's run-loki.sh adds LOKI_EXTRA_ARGS to Loki's
    # flags: recheck that on an OBS_IMAGE bump, or this setting is dropped without an error.
    environment:
      LOKI_EXTRA_ARGS: -ingester.wal-disk-full-threshold=0
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 1s
      timeout: 3s
      retries: 120
volumes:
  db: {}
