# Harness file (protected). Every rule here is documented in docs/harness/rules.md.
# Change only via PR with "Harness change: Y" and a rationale.
version: "2"

run:
  timeout: 3m
  build-tags: [integration] # lint/type-check integration tests too

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - noctxroot
    - domainiso
    - forbidigo
    - sloglint
    - gosec # rules.md#go-sec: all checks at gosec's defaults, tests included
    - funlen # rules.md#code-function-length (ADR 0024)
    - gocognit # rules.md#code-complexity (ADR 0024)
    - revive # rules.md#code-parameters, rules.md#code-file-length (ADR 0024): only the two rules below
    - dupl # rules.md#repo-no-clones (ADR 0027): token clones within one package, tests included
  settings:
    # ADR 0024: each threshold is the worst value at P4.2's base (1b7aa0f, re-verified at 0bd8958) and only
    # goes down; never raise one.
    # rules.md#code-function-length: statements, not lines (worst: telemetry.go (*Telemetry).setup, 35)
    funlen:
      lines: -1
      statements: 35
    # rules.md#code-complexity: cognitive complexity (worst: approvaltest.go Verify and telemetry.go setup, 13)
    gocognit:
      min-complexity: 13
    # Only these two rules: revive's defaults (exported, var-naming, …) are the naming style ADR 0024 keeps out.
    revive:
      rules:
        # rules.md#code-parameters (worst: approvaltest.go Verify and problem.go Write, 4; a variadic counts as one)
        - name: argument-limit
          arguments: [4]
        # rules.md#code-file-length: every line, as wc -l counts (worst over all files, tests included: approvaltest.go, 205)
        - name: file-length-limit
          arguments: [{ max: 205, skipComments: false, skipBlankLines: false }]
    # rules.md#repo-no-clones (ADR 0027): syntax-tree tokens, not lines (golangci's default is 150). The strictest
    # value the tree passes with a `make new-domain` domain in it; 25 trips problem_test.go. Only goes down.
    dupl:
      threshold: 26
    custom:
      noctxroot:
        type: module
        description: "context.Background/TODO only in cmd/ and tests (rules.md#go-no-root-context)"
      domainiso:
        type: module
        description: "no cross-domain store/api imports (rules.md#go-domain-isolation)"
    # rules.md#go-structured-logging (std log is allowed in platform: see exclusions.rules)
    forbidigo:
      analyze-types: true # match by package path, so a variable named `log` or a renamed import is judged by its type
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          pkg: ^fmt$
          msg: "[go-structured-logging] fmt.Print* writes unstructured text to stdout. Fix: log through the injected *slog.Logger (logging.New in platform) with key-value pairs or slog.Attr values, or return the error. See docs/harness/rules.md#go-structured-logging"
        - pattern: ^log\.
          pkg: ^log$
          msg: "[go-structured-logging] std log package outside platform. Fix: log through the injected *slog.Logger (logging.New in platform) with key-value pairs or slog.Attr values, or return the error. See docs/harness/rules.md#go-structured-logging"
    # rules.md#go-structured-logging: either key-value pairs or slog.Attr values per call, never both; no key-case check (naming style, ADR 0024)
    sloglint:
      no-mixed-args: true
    depguard:
      rules:
        # rules.md#go-db-only-in-store
        db-only-in-store:
          files:
            - "$all"
            - "!**/internal/*/store/**"
            - "!**/internal/platform/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: "[go-db-only-in-store] DB drivers belong in internal/<domain>/store (or platform). Fix: add a sqlc query in db/queries/<domain>.sql, run `make gen`, and call the generated store method from the service. See docs/harness/rules.md#go-db-only-in-store"
            - pkg: database/sql
              desc: "[go-db-only-in-store] DB drivers belong in internal/<domain>/store (or platform). Fix: add a sqlc query in db/queries/<domain>.sql, run `make gen`, and call the generated store method from the service. See docs/harness/rules.md#go-db-only-in-store"
        # rules.md#go-http-only-in-api
        http-only-in-api:
          files:
            - "$all"
            - "!**/internal/*/api/**"
            - "!**/internal/platform/**"
            - "!**/cmd/**"
          deny:
            - pkg: net/http
              desc: "[go-http-only-in-api] net/http belongs in internal/<domain>/api, platform or cmd. Fix: keep transport concerns (status codes, headers, requests) in the api layer and pass plain Go types into the service. See docs/harness/rules.md#go-http-only-in-api"
        # rules.md#go-test-helpers-only-in-tests (ADR 0022)
        go-test-helpers-only-in-tests:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/aheumaier/harness-template/apps/api/internal/platform/approvaltest
              desc: "[go-test-helpers-only-in-tests] approvaltest pins responses in handler tests and writes files under testdata/. Fix: import it only from a _test.go file; production code never needs it. See docs/harness/rules.md#go-test-helpers-only-in-tests"
  exclusions:
    generated: strict
    rules:
      # rules.md#go-structured-logging: platform may wrap the std log package (e.g. http.Server.ErrorLog); fmt.Print* stays forbidden there
      - path: internal/platform/
        linters: [forbidigo]
        text: "std log package outside platform"
      # ADR 0024: tests are exempt from the per-function limits and stay under code-file-length
      - path: _test\.go
        linters: [funlen, gocognit]
      - path: _test\.go
        linters: [revive]
        text: "argument-limit"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aheumaier/harness-template
