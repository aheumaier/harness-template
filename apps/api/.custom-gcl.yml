# Builds .bin/golangci-lint-custom = golangci-lint + this repo's analyzers (tools/analyzers).
# Version must equal GOLANGCI_LINT_VERSION in scripts/tool-versions.env (checked by make lint-go).
version: v2.15.0
name: golangci-lint-custom
destination: ../../.bin
plugins:
  - module: github.com/aheumaier/harness-template/apps/api/tools/analyzers
    path: ./tools/analyzers
