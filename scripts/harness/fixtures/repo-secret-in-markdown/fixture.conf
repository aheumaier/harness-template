# A (fake) AWS access key in a *.md file: Trivy's built-in allow-list would skip it without trivy-secret.yaml.
# SCOPE=changed: the scan of only the changed files must find it.
RULE=repo-no-secrets
TARGET=secrets
EXPECT='^fx-credentials\.md:3: CRITICAL secret: AWS Access Key ID .*\[repo-no-secrets\]'
SCOPE=changed
