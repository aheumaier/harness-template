# A Swift test in a folder the package declares no test target for: swift test would pass without compiling it
# (ADR 0044).
RULE=ios-tests-pass
TARGET=test-ios
EXPECT='/Tests/LooseTests/LooseTests\.swift:1: no test target of .*/Package\.swift compiles it, so swift test never runs it \[ios-tests-pass\]'
NEEDS_SWIFT=1
