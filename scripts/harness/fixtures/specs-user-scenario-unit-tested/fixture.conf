# With db in STACK, a scenario a user sees that only a unit test names: no journey or integration test runs the
# app for it, and it carries no (unit: <reason>) marker (ADR 0049).
RULE=specs-scenarios-tested
TARGET=specs-tested
EXPECT='specs/900-demo/spec.md:9: 900/US1-AS1 is a scenario a user sees and only other tests name it \(.*/cart/service/pay_test\.go\)'
STACK=db
