# A .bin/harness test starts a process through an exec.Cmd literal, in a file whose name ends in helpers_test.go
# and under a generated-code header: none of the three may hide it.
RULE=harness-tests-exec-in-helpers
TARGET=lint-harness
EXPECT='zz_helpers_test\.go:[0-9]+:[0-9]+: use of `exec\.Cmd` forbidden because "\[harness-tests-exec-in-helpers\]'
