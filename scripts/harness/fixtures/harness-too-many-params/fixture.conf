# A .bin/harness function with 7 parameters, one past lint-harness's revive argument-limit threshold (6). The file
# name holds "_test.go" without ending in it, so the fixture fails if the tests' exclusion loses its $ anchor.
RULE=code-parameters
TARGET=lint-harness
EXPECT='zz_test\.go_fixture\.go:[0-9]+:[0-9]+: argument-limit: maximum number of arguments per function exceeded; max [0-9]+ but got [0-9]+ \(revive\)'
