openapi: 3.1.0
info:
  title: fixture
  version: 0.0.0
  description: Minimal self-contained spec for a harness fixture.
  contact: { name: fixture, url: https://example.invalid }
servers:
  - url: http://localhost:8080
tags:
  - name: platform
    description: Fixture tag.
paths:
  /order_items:
    get:
      operationId: getThing
      summary: Fixture operation
      description: Fixture operation.
      tags: [platform]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thing' }
        '4XX':
          description: Client error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '5XX':
          description: Server error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  schemas:
    Thing:
      type: object
      properties:
        name: { type: string }
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
