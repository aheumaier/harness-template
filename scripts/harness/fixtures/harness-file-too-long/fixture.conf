# A .bin/harness file of 661 lines, past lint-harness's revive file-length-limit threshold (556). Comment lines
# count (skipComments: false).
RULE=code-file-length
TARGET=lint-harness
EXPECT='zz_fixture\.go:[0-9]+: file-length-limit: file length is [0-9]+ lines, which exceeds the limit of [0-9]+ \(revive\)'
