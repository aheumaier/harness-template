# A vendored upstream spec whose source removed a path since the vendored revision (rules.md#api-upstream-no-breaking-change).
RULE=api-upstream-no-breaking-change
TARGET=upstream-drift
EXPECT='^api/upstream/openapi\.yaml: 1 breaking change\(s\) in .* since vendored [0-9a-f]{12}: .*\[api-upstream-no-breaking-change\]'
