# scripts/tool-versions.env pins an Xcode the host does not select (ADR 0043). Needs Xcode itself: proven on
# the macOS CI job, skipped where only the command-line tools are selected.
RULE=ios-xcode-pinned
TARGET=xcode-pinned
EXPECT='the selected Xcode is .*, scripts/tool-versions.env pins XCODE_VERSION=0\.0'
NEEDS_XCODE=1
