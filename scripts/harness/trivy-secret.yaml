# Harness file (protected). Trivy secret-scan config for repo-no-secrets (docs/harness/rules.md), passed by
# scripts/harness/trivy.sh as --secret-config. Built-in rules only; this switches off Trivy's built-in
# path allow-list, which skips test files, examples, vendor dirs and every *.md: a key pasted into
# docs, a test or an example must fail too.
disable-allow-rules:
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - conda
  - ruby
  - rust
  - wordpress
